[package]
name = "mlyr"
version = "0.1.0"
edition = "2024"
authors = ["sharkow"]
description = "mlyr is a Rust library designed to parse, validate, serialize, and embed synchronized lyrics"
license = "MIT"
repository = "https://github.com/Sharkow1743/mlyr"
readme = "README.md"
exclude = [
    ".gitignore",
    ".cargo_vcs_info.json",
]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
quick-xml = { version = "0.37", features = ["serialize"] }
thiserror = "2.0"
lofty = "0.24"
