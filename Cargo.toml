[package]
name = "mlyr"
version = "0.4.0"
edition = "2024"
authors = ["sharkow"]
description = "mlyr is a Rust library designed to parse, validate, serialize, and embed synchronized lyrics"
license = "MIT"
repository = "https://github.com/Sharkow1743/mlyr"
readme = "README.md"
exclude = [
    ".gitignore"
]

[features]
default = ["convert", "xml", "lrc", "lyricsfile", "ttml", "embedding", "fetch"]
full = ["convert", "xml", "lrc", "lyricsfile", "ttml", "embedding", "richsync", "lyricify", "fetch"]
convert = []
lrc = ["convert"]
richsync = ["convert", "dep:serde", "dep:serde_json"]
lyricsfile = ["convert", "dep:serde", "dep:serde_yaml_ng"]
ttml = ["convert"]
lyricify = ["convert"]
xml = ["convert", "dep:quick-xml", "dep:serde"]
embedding = ["xml", "dep:lofty"]
fetch = ["convert", "dep:reqwest", "dep:futures", "dep:serde_json"]

[dependencies]
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
quick-xml = { version = "0.42", features = ["serialize"], optional = true }
thiserror = "2.0"
lofty = { version = "0.25", optional = true }
serde_yaml_ng = { version = "0.10", optional = true }
reqwest = { version = "0.13", optional = true, features = ["json"] }
futures = { version = "0.3", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
